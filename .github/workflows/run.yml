permissions:
  contents: write

name: run
on:
  workflow_dispatch:
  schedule:
    # run an hour before midnight UTC
    - cron: "0 23 * * *"

jobs:
  check:
    runs-on: ubuntu-22.04
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"

      - name: Check streak
        id: check
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        continue-on-error: true
        run: |
          npm ci
          printenv
          npm start

          echo "ok=$?" >> "$GITHUB_OUTPUT"

  save:
    needs: check
    if: needs.check.outputs.ok == '0'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Save streak
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          owner_json="$(curl -fsSL "https://api.github.com/users/${REPO_OWNER}")"

          owner_type="$(printf '%s' "$owner_json" | jq -r '.type')"
          if [ "$owner_type" != "User" ]; then
            echo "An organization owns this repository. Unable to auto-attribute contributions to a user."
            exit 1
          fi

          owner_id="$(printf '%s' "$owner_json" | jq -r '.id')"
          author_name="$REPO_OWNER"
          author_email="${owner_id}+${REPO_OWNER}@users.noreply.github.com"

          git config user.name "$author_name"
          git config user.email "$author_email"

          echo "$(date)" >> streak.txt
          git add streak.txt

          git commit -m "chore[streaksaver]: save streak"
          git push
