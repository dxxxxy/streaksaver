permissions:
  contents: write

name: run
on:
  workflow_dispatch:
  schedule:
    # run an hour before midnight UTC
    - cron: "0 23 * * *"

jobs:
  check:
    runs-on: ubuntu-22.04
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"

      - name: Check streak
        id: check
        continue-on-error: true
        run: |
          npm ci
          npm start

          echo "ok=$?" >> "$GITHUB_OUTPUT"

  save:
    needs: check
    if: needs.check.outputs.ok == '0'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Save streak
        run: |
          git config user.name "${GITHUB_REPOSITORY_OWNER}"
          git config user.email "${GITHUB_REPOSITORY_OWNER_ID}+${GITHUB_REPOSITORY_OWNER}@users.noreply.github.com"

          echo "$(date)" >> streak.txt
          git add streak.txt

          git commit -m "chore[streaksaver]: save streak"
          git push
